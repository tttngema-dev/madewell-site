<!-- Supabase → Authentication → Emails → Templates → "Reset Password"
     (this is the email people get from "Forgot your password?" on the sign-in page)
     Subject:  {{ .Token }} is your Made Well password reset code -->
<div style="background:#0b1730;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <table role="presentation" align="center" width="100%" style="max-width:480px;background:#ffffff;border-radius:14px;overflow:hidden">
    <tr><td style="background:#122244;padding:22px 28px;text-align:center">
      <img src="{{ .SiteURL }}/logo.png" alt="Made Well" height="56" style="height:56px;display:inline-block">
    </td></tr>
    <tr><td style="padding:28px;color:#1d1d1d;font-size:16px;line-height:1.55">
      <p style="margin:0 0 12px;font-size:20px;font-weight:700">Reset your Made Well password</p>
      <p style="margin:0 0 18px">Enter this code on the sign-in page, then choose a new password:</p>
      <p style="margin:0 0 20px;text-align:center;font-size:34px;letter-spacing:8px;font-weight:700;color:#122244;background:#f6f1e7;border-radius:10px;padding:14px 8px">{{ .Token }}</p>
      <p style="margin:0;color:#666;font-size:13px">The code expires soon. If you didn&rsquo;t ask to reset your password, you can ignore this email: your password has not changed.</p>
    </td></tr>
  </table>
</div>
