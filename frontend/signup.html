<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create account — Made Well</title>
  <meta name="description" content="Create a free Made Well account to save government tenders and store your company profile." />
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth-pages.css" />
  <script src="track.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="Made Well home"><img src="logo.png" alt="Made Well" width="57" height="84" /></a>
    <nav>
      <a href="tenders.html">Tenders</a>
      <a class="btn small" href="login.html">Sign in</a>
    </nav>
  </header>
  <div class="bulbs" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="sub">Free account for tender tracking and company details. Company registration is a separate service.</p>

      <form id="form-signup" class="auth-form">
        <label>Email
          <input type="email" name="email" required autocomplete="email" placeholder="you@company.co.za" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
        </label>
        <label>Confirm password
          <input type="password" name="confirm" required autocomplete="new-password" minlength="8" />
        </label>
        <p id="msg" class="form-msg" role="status" hidden></p>
        <button class="btn" type="submit">Create account</button>
      </form>

      <form id="form-verify" class="auth-form" hidden>
        <h2 style="font-size:1.2rem">Check your email</h2>
        <p class="fine" id="verify-sent">We emailed you a code.</p>
        <label>Verification code
          <input type="text" name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="12" placeholder="123456" style="letter-spacing:.3em;font-size:1.4rem;text-align:center" />
        </label>
        <p id="msg-verify" class="form-msg" role="status" hidden></p>
        <button class="btn" type="submit">Verify &amp; continue</button>
        <p class="fine"><button type="button" id="verify-resend" class="linkish">Send a new code</button></p>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const NEXT = MWAuth.safeNext(new URLSearchParams(location.search).get('next'));
    const LOGIN_HREF = 'login.html?next=' + encodeURIComponent(NEXT);
    document.querySelectorAll('a[href="login.html"]').forEach((a) => { a.href = LOGIN_HREF; });
    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get('email');
      const password = fd.get('password');
      const confirm = fd.get('confirm');
      const msg = document.getElementById('msg');
      const btn = e.target.querySelector('button[type=submit]');

      if (password !== confirm) {
        msg.hidden = false;
        msg.className = 'form-msg err';
        msg.textContent = 'Passwords do not match.';
        return;
      }
      btn.disabled = true;
      try {
        const { data, error } = await MWAuth.signUp(email, password);
        if (error) throw error;
        // Supabase hides whether an email is already registered: it answers "success" with a user that has no identities.
        if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
          msg.hidden = false;
          msg.className = 'form-msg err';
          msg.innerHTML = 'An account with this email already exists. <a href="' + LOGIN_HREF + '">Sign in instead</a>.';
          return;
        }
        msg.hidden = false;
        msg.className = 'form-msg ok';
        if (data.session) {
          msg.textContent = 'Account created. Redirecting…';
          setTimeout(() => (location.href = NEXT), 800);
        } else {
          msg.hidden = true;
          showVerify(email);
        }
      } catch (err) {
        msg.hidden = false;
        msg.className = 'form-msg err';
        msg.textContent = err.message || 'Could not create account';
      } finally {
        btn.disabled = false;
      }
    });

    let pendingEmail = '';
    function say(id, text, ok) { const el = document.getElementById(id); el.hidden = !text; el.textContent = text || ''; el.className = 'form-msg ' + (ok ? 'ok' : 'err'); }
    function cooldown(btn, secs) {
      btn.disabled = true; let n = secs; const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
      const t = setInterval(() => { n--; if (n <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = label; } else btn.textContent = label + ' (' + n + 's)'; }, 1000);
      btn.textContent = label + ' (' + n + 's)';
    }
    function showVerify(email) {
      pendingEmail = email;
      document.getElementById('form-signup').hidden = true;
      document.getElementById('form-verify').hidden = false;
      document.getElementById('verify-sent').textContent = 'We emailed a code to ' + email + '. Enter it below to confirm your account. It can take a minute. Check spam too.';
      document.querySelector('#form-verify [name=code]').focus();
      cooldown(document.getElementById('verify-resend'), 30);
    }
    document.getElementById('form-verify').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const { error } = await MWAuth.verifySignupCode(pendingEmail, new FormData(e.target).get('code'));
        if (error) throw error;
        say('msg-verify', 'Verified. Taking you to your dashboard…', true);
        setTimeout(() => (location.href = NEXT), 600);
      } catch (err) {
        say('msg-verify', /expired|invalid/i.test(err.message || '') ? 'That code is wrong or has expired. Check it, or send a new one.' : (err.message || 'Could not verify the code'), false);
      } finally { btn.disabled = false; }
    });
    document.getElementById('verify-resend').addEventListener('click', async (e) => {
      try { const { error } = await MWAuth.resendSignupCode(pendingEmail); if (error) throw error; say('msg-verify', 'New code sent.', true); cooldown(e.target, 30); }
      catch (err) { say('msg-verify', err.message || 'Could not send a new code', false); }
    });
  </script>
</body>
</html>
