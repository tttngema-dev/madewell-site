<script>
const API_BASE = ["localhost","127.0.0.1"].includes(location.hostname) ? "http://localhost:4000" : "https://madewell-backend.onrender.com";
const ref = new URLSearchParams(location.search).get("ref") || "";
document.getElementById("ref").textContent = ref;
document.getElementById("retry").addEventListener("click", async () => {
  const err = document.getElementById("err"); err.hidden = true;
  showLoader("Preparing your payment…");
  try {
    const r = await fetch(API_BASE + "/api/registrations/pay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reference: ref }) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error);
    goToPayfast(out.payfast);
  } catch (e) { hideLoader(); err.textContent = "We couldn’t restart your payment: " + e.message; err.hidden = false; }
});
