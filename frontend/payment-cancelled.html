<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment not completed — Made Well</title><link rel="icon" href="logo.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="top"><a class="brand" href="index.html" aria-label="Made Well home"><img src="logo.png" alt="Made Well" width="56" height="56" /></a></header>
<div class="bulbs" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
<main class="reg"><section class="confirm"><h2>Payment not completed</h2>
<p>No problem. Your details are saved, and you haven’t been charged. Reference: <code id="ref"></code></p>
<p id="err" class="error" hidden></p>
<button class="btn" id="retry" type="button">Try paying again</button></section></main>
<div class="bulbs" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
<script src="pay.js"></script>
<script>
const API_BASE = ["localhost","127.0.0.1"].includes(location.hostname) ? "http://localhost:4000" : "https://madewell-backend.onrender.com";
const ref = new URLSearchParams(location.search).get("ref") || "";
document.getElementById("ref").textContent = ref;
document.getElementById("retry").addEventListener("click", async () => {
  const err = document.getElementById("err"); err.hidden = true;
  try {
    const r = await fetch(API_BASE + "/api/registrations/pay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reference: ref }) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error);
    goToPayfast(out.payfast);
  } catch (e) { err.textContent = "We couldn’t restart your payment: " + e.message; err.hidden = false; }
});
</script></body></html>
